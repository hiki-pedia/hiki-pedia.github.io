name: 글·문서 수정
description: 오탈자, 잘못된 설명, 보완할 내용을 기록합니다.
body:
  - type: input
    id: page
    attributes:
      label: 수정할 글 또는 문서
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 수정할 내용과 이유
      description: 확인한 근거가 있으면 함께 적어주세요.
    validations:
      required: true
