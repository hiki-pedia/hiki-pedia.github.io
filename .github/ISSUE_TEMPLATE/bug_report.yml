name: 화면·빌드 오류
description: 블로그의 화면, 링크, 빌드 문제를 기록합니다.
body:
  - type: input
    id: page
    attributes:
      label: 문제가 있는 페이지
      placeholder: 페이지 주소 또는 파일 경로
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 기대한 동작과 실제 결과, 재현 순서를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 확인 환경
      description: 브라우저, 화면 너비, 빌드 로그 등 재현에 필요한 내용을 적어주세요.
