# 사이트 설정을 바꾸면 로컬 Jekyll 서버를 다시 시작합니다.
locale: ko-KR
title: DNHS
title_separator: '|'
subtitle: engineering
name: Woo heeseok
description: 프로젝트 구현 과정과 데이터·인프라 운영 기록을 정리하는 기술 블로그입니다.
url: https://hiki-pedia.github.io
teaser: /assets/images/default-teaser.png
logo: /assets/images/4396623.png
breadcrumbs: true
words_per_minute: 100
search: true
search_full_content: true
after_footer_scripts:
- /assets/js/custom.js
lunr:
  search_within_pages: true
naver_site_verification: ee1ed77a6f291d1035601fb0d0d9508838c43045
author:
  name: Woo heeseok
  avatar: /assets/images/IMG_3964.jpg
  bio: I am a **visionary** man.
  location: Seoul/Korea <br>   Jeonju/Korea
  email: milkheesuk@naver.com
  links:
  - label: Email
    icon: fas fa-fw fa-envelope-square
    url: mailto:milkheesuk@naver.com
  - label: GitHub
    icon: fab fa-fw fa-github
    url: https://github.com/hiki-pedia/hiki-pedia.github.io
  - label: Instagram
    icon: fab fa-fw fa-instagram
    url: https://www.instagram.com/hiki__pedia_/
footer:
  links:
  - label: GitHub
    icon: fab fa-fw fa-github
    url: https://github.com/hiki-pedia?tab=repositories
  - label: Instagram
    icon: fab fa-fw fa-instagram
    url: https://www.instagram.com/hiki__pedia_/
include:
- _pages
exclude:
- vendor
- node_modules
- .bundle
- .sass-cache
- .jekyll-cache
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
- assets/images/reference.md
- scripts
- banner.js
- Gemfile
- Gemfile.lock
- package.json
- package-lock.json
- README.md
- LICENSE
encoding: utf-8
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Seoul
plugins:
- jekyll-sitemap
- jekyll-feed
- jekyll-include-cache
whitelist:
- jekyll-sitemap
- jekyll-feed
- jekyll-include-cache
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: single
    author_profile: false
    toc: true
    toc_sticky: true
    sidebar:
      nav: docs
    read_time: true
    share: true
    related: true
    future: true
    show_date: true
- scope:
    path: ''
    type: pages
  values:
    layout: single
    author_profile: true
    toc_sticky: true
baseurl: ''
