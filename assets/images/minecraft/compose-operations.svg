<rect x="65" y="422" width="400" height="82" rx="12" fill="#ecfdf5" stroke="#a7d9bf" stroke-width="2"/>
<text x="85" y="456" class="section">Prometheus → Grafana</text>
<text x="85" y="488" class="body">호스트·게임 지표 → Discord 알림</text>
