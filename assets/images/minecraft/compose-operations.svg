<rect x="575" y="315" width="400" height="78" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="595" y="349" class="section">Paper · Java · CalmlandMap</text>
<text x="595" y="381" class="body">운영 월드·플레이어 데이터: SSD</text>
<rect x="575" y="422" width="400" height="82" rx="12" fill="#ecfdf5" stroke="#a7d9bf" stroke-width="2"/>
